<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RBX - Sua Key</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    @keyframes keyReveal {
      0%   { opacity: 0; transform: scale(0.8); filter: blur(8px); }
      60%  { transform: scale(1.04); }
      100% { opacity: 1; transform: scale(1); filter: blur(0); }
    }
    .key-appear { animation: keyReveal 0.6s ease both; }
    .copy-feedback {
      font-size: 13px;
      color: #c400ff;
      margin-top: 6px;
      min-height: 20px;
      transition: opacity 0.3s;
    }
  </style>
</head>
<body>

<div class="stars-bg" id="stars"></div>

<header>
  <div class="header-logo">
    <a href="index.html">
      <img src="assets/logo.png" alt="RBX Logo" class="logo-img" onerror="this.style.display='none';document.getElementById('lf').style.display='flex'"/>
      <div id="lf" style="display:none;width:40px;height:40px;background:linear-gradient(135deg,#7b00ff,#c400ff);border-radius:8px;align-items:center;justify-content:center;font-family:'Orbitron',monospace;font-weight:900;color:#fff;font-size:18px;filter:drop-shadow(0 0 8px #c400ff)">R</div>
    </a>
  </div>
  <nav class="nav-center">
    <a href="index.html">Lobby</a>
    <a href="index.html#utility">Utility</a>
  </nav>
  <div class="header-right">
    <a href="https://discord.gg/Zmb66jX3tZ" target="_blank" class="discord-btn" title="Join our Discord">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 127.14 96.36" fill="currentColor">
        <path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21h0A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1A105.25,105.25,0,0,0,126.6,80.22h0C129.24,52.84,122.09,29.11,107.7,8.07ZM42.45,65.69C36.18,65.69,31,60,31,53s5-12.74,11.43-12.74S54,46,53.89,53,48.84,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.25,60,73.25,53s5-12.74,11.44-12.74S96.23,46,96.12,53,91.08,65.69,84.69,65.69Z"/>
      </svg>
      Discord
    </a>
  </div>
</header>

<main>
  <div class="page-center">
    <div class="checkpoint-box">
      <h2 style="font-size:2rem;margin-bottom:14px">🎉 Parabéns!</h2>
      <p>
        Você completou todos os checkpoints.<br>
        Clique no botão abaixo para gerar sua key.
      </p>

      <div id="key-area" style="display:none;margin-bottom:20px">
        <div class="key-label">Sua Key:</div>
        <div class="key-display key-appear" id="key-value">—</div>
        <button class="btn btn-outline" style="width:100%;margin-bottom:8px" onclick="copyKey()">Copiar Key</button>
        <div class="copy-feedback" id="copy-feedback"></div>
      </div>

      <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:12px">
        <button id="gen-btn" class="btn btn-primary" onclick="generateKey()">Gerar Key</button>
        <a href="index.html" class="btn btn-outline">Voltar ao Início</a>
      </div>
    </div>
  </div>
</main>

<script>
(function() {
  var c = document.getElementById('stars');
  for (var i = 0; i < 60; i++) {
    var s = document.createElement('div');
    s.className = 'star';
    s.style.left  = Math.random()*100+'vw';
    s.style.top   = Math.random()*100+'vh';
    s.style.setProperty('--dur',   (3+Math.random()*5)+'s');
    s.style.setProperty('--delay', (Math.random()*6)+'s');
    c.appendChild(s);
  }
})();

async function generateKey() {
  var genBtn   = document.getElementById('gen-btn');
  var keyValue = document.getElementById('key-value');
  var keyArea  = document.getElementById('key-area');
  var feedback = document.getElementById('copy-feedback');

  genBtn.disabled = true;
  genBtn.textContent = '⏳ Gerando...';
  feedback.textContent = '';

  try {
    var apiUrl = 'https://rbxadminkey.netlify.app/api/generate'
      + '?token=redux-admin-secret'
      + '&type=free'
      + '&days=1'
      + '&user=KeyReward';

    var response = await fetch(apiUrl);
    var data = await response.json();

    if (!data.success || !data.key) {
      feedback.style.color = '#ff5555';
      feedback.textContent = '❌ Erro ao gerar key. Tente novamente.';
      genBtn.disabled = false;
      genBtn.textContent = 'Gerar Key';
      return;
    }

    var key = data.key;
    keyValue.textContent = key;
    keyValue.classList.remove('key-appear');
    void keyValue.offsetWidth;
    keyValue.classList.add('key-appear');

    keyArea.style.display = 'block';
    genBtn.disabled = false;
    genBtn.textContent = 'Gerar Nova Key';
    feedback.style.color = '#c400ff';
    feedback.textContent = '✅ Key gerada e registrada no servidor!';
    setTimeout(function() { feedback.textContent = ''; }, 3000);

  } catch (err) {
    feedback.style.color = '#ff5555';
    feedback.textContent = '❌ Erro de rede. Verifique sua conexão.';
    genBtn.disabled = false;
    genBtn.textContent = 'Gerar Key';
  }
}

function copyKey() {
  var key = document.getElementById('key-value').textContent;
  if (!key || key === '—') return;

  navigator.clipboard.writeText(key).then(function() {
    document.getElementById('copy-feedback').textContent = '✅ Key copiada!';
    setTimeout(function() {
      document.getElementById('copy-feedback').textContent = '';
    }, 2500);
  }).catch(function() {
    var input = document.createElement('input');
    input.value = key;
    document.body.appendChild(input);
    input.select();
    document.execCommand('copy');
    document.body.removeChild(input);
    document.getElementById('copy-feedback').textContent = '✅ Key copiada!';
  });
}
</script>

</body>
</html>
